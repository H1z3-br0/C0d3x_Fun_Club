[project]
name = "ctf-agent-two"
version = "0.1.0"
description = "CTF agent v2 - multi-model solver swarm (GPT-5.5 + Claude Opus) via cli-proxy-api"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings",
    "genai-prices",
    "aiodocker",
    "httpx",
    "pyyaml",
    "rich",
    "click",
    "markdownify",
    "openai",
    "lancedb",
    "pyarrow",
]

[project.optional-dependencies]
# Standalone challenge downloader (pull_challenges.py) — not used by the agent itself.
#   uv sync --extra pull
pull = ["aiohttp", "beautifulsoup4"]

[project.scripts]
ctf-agent = "backend.cli:cli"
ctf-solve = "backend.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
    "ty>=0.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH"]
ignore = ["E501", "SIM105", "SIM115", "PTH123"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ty.environment]
python-version = "3.12"
